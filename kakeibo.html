<!DOCTYPE html>

<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>かんたん家計簿</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="かんたん家計簿" />
  <meta name="theme-color" content="#10b981" />
  <style>
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    html, body { height: 100%; background: #f5f5f0; font-family: 'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif; }
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    input, button, textarea { font-family: inherit; }
    @keyframes slideUp { from { transform:translateY(60px);opacity:0 } to { transform:translateY(0);opacity:1 } }
    @keyframes fadeIn  { from { opacity:0 } to { opacity:1 } }
    #app { max-width:480px; margin:0 auto; min-height:100vh; position:relative; }

.header { background:#fff; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #f1f5f9; position:sticky; top:0; z-index:10; }
.header-logo { width:36px; height:36px; border-radius:10px; background:#10b981; display:flex; align-items:center; justify-content:center; font-size:18px; }
.header-title { font-weight:800; font-size:17px; margin-left:10px; }
.nav-btn { background:none; border:none; font-size:22px; cursor:pointer; color:#94a3b8; padding:0 6px; }
.nav-label { font-weight:700; font-size:15px; min-width:78px; text-align:center; }

.content { padding:14px 14px 100px; }
.card { background:#fff; border-radius:16px; box-shadow:0 1px 4px rgba(0,0,0,.06); }

.summary-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:12px; }
.summary-card { background:#fff; border-radius:16px; padding:14px 10px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
.summary-label { font-size:12px; color:#94a3b8; font-weight:600; }
.summary-icon { width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; }
.summary-value { font-weight:800; font-size:15px; letter-spacing:-0.5px; margin-top:8px; }

.banner { background:#fff; border-radius:16px; padding:16px 18px; margin-bottom:14px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
.banner-amount { font-weight:800; font-size:22px; }
.banner-msg { font-size:13px; color:#6b7280; margin-top:5px; }
.progress-bar-bg { background:#f1f5f9; border-radius:6px; height:8px; overflow:hidden; margin-top:8px; }
.progress-bar { height:100%; border-radius:6px; transition:width .6s ease; }

.tabs { display:flex; background:#fff; border-radius:14px; padding:4px; margin-bottom:14px; box-shadow:0 1px 4px rgba(0,0,0,.06); gap:2px; }
.tab-btn { flex:1; padding:9px 0; border-radius:10px; border:none; cursor:pointer; font-weight:500; font-size:11px; color:#94a3b8; background:transparent; transition:all .2s; }
.tab-btn.active { background:#f1f5f9; font-weight:700; color:#1e293b; }

.date-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:7px; padding:0 4px; }
.date-label { font-size:13px; color:#64748b; font-weight:600; }
.tx-list { display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
.tx-row { background:#fff; border-radius:14px; padding:11px 13px; display:flex; align-items:center; gap:8px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
.cat-badge { display:inline-flex; align-items:center; gap:5px; padding:4px 9px; border-radius:20px; font-size:12px; font-weight:600; white-space:nowrap; flex-shrink:0; }
.cat-dot { width:7px; height:7px; border-radius:50%; display:inline-block; }
.tx-memo { flex:1; font-size:14px; color:#374151; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tx-amount { font-weight:700; font-size:15px; white-space:nowrap; }
.icon-btn { background:none; border:none; cursor:pointer; font-size:15px; color:#cbd5e1; padding:0 1px; flex-shrink:0; }

.cat-row { margin-bottom:14px; }
.cat-row-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; }

.fab { position:fixed; bottom:28px; right:calc(50% - 196px); width:56px; height:56px; border-radius:50%; border:none; cursor:pointer; box-shadow:0 4px 16px rgba(0,0,0,.2); font-size:28px; color:#fff; display:flex; align-items:center; justify-content:center; z-index:20; transition:background .3s; }

.modal-overlay { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center; }
.modal-sheet { background:#fff; border-radius:20px 20px 0 0; width:100%; max-width:480px; max-height:90vh; overflow-y:auto; padding:24px 20px 40px; animation:slideUp .25s ease; }
.modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
.modal-title { font-weight:700; font-size:17px; }
.modal-close { background:#f1f5f9; border:none; border-radius:50%; width:32px; height:32px; cursor:pointer; font-size:15px; color:#64748b; }

.form-label { display:block; font-size:13px; color:#64748b; margin-bottom:6px; font-weight:600; }
.form-input { width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid #e2e8f0; font-size:15px; background:#f8fafc; outline:none; }
.form-input:focus { border-color:#10b981; }
.form-textarea { width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid #e2e8f0; font-size:15px; background:#f8fafc; outline:none; resize:none; min-height:120px; line-height:1.7; }
.form-textarea:focus { border-color:#6366f1; }
.type-toggle { display:flex; background:#f1f5f9; border-radius:12px; padding:4px; margin-bottom:16px; }
.type-btn { flex:1; padding:10px 0; border-radius:9px; border:none; cursor:pointer; font-weight:700; font-size:14px; background:transparent; color:#64748b; transition:all .2s; }
.cat-chips { display:flex; flex-wrap:wrap; gap:8px; }
.cat-chip { padding:7px 13px; border-radius:20px; border:1.5px solid #e2e8f0; background:#fff; color:#64748b; font-size:13px; cursor:pointer; }
.submit-btn { width:100%; padding:14px 0; border-radius:14px; border:none; color:#fff; font-weight:800; font-size:16px; cursor:pointer; margin-top:4px; }

.confirm-overlay { position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; }
.confirm-box { background:#fff; border-radius:18px; padding:24px 24px 20px; width:280px; box-shadow:0 8px 32px rgba(0,0,0,.18); animation:fadeIn .15s; }
.confirm-msg { font-size:15px; color:#1e293b; margin-bottom:20px; text-align:center; font-weight:600; }
.confirm-btns { display:flex; gap:10px; }
.confirm-cancel { flex:1; padding:11px 0; border-radius:12px; border:1.5px solid #e2e8f0; background:#fff; color:#64748b; font-weight:600; font-size:14px; cursor:pointer; }
.confirm-ok { flex:1; padding:11px 0; border-radius:12px; border:none; background:#f43f5e; color:#fff; font-weight:700; font-size:14px; cursor:pointer; }

.empty { text-align:center; padding:60px 0; color:#94a3b8; }
.empty-icon { font-size:40px; margin-bottom:10px; }

.sub-tabs { display:flex; background:#fff; border-radius:14px; padding:4px; margin-bottom:14px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
.sub-tab { flex:1; padding:9px 0; border-radius:11px; border:none; cursor:pointer; font-weight:500; font-size:14px; background:transparent; color:#94a3b8; transition:all .2s; }

.graph-bar-wrap { display:flex; align-items:flex-end; gap:4px; overflow-x:auto; }
.graph-month { flex:1; min-width:22px; display:flex; flex-direction:column; align-items:center; gap:3px; }
.graph-bars { display:flex; align-items:flex-end; gap:2px; }
.graph-bar { width:9px; border-radius:3px 3px 0 0; transition:height .5s ease; }
.graph-mlabel { font-size:10px; color:#94a3b8; margin-top:2px; }
.graph-totals { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:16px; padding-top:14px; border-top:1px solid #f1f5f9; }
.graph-total-item { text-align:center; }
.graph-total-label { font-size:11px; color:#94a3b8; margin-bottom:3px; }
.graph-total-value { font-size:13px; font-weight:700; }

.budget-edit-row { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.budget-cat-name { display:flex; align-items:center; gap:6px; width:90px; flex-shrink:0; font-size:13px; font-weight:600; }

/* メモカード */
.memo-card { background:#fff; border-radius:16px; padding:16px 16px 14px; box-shadow:0 1px 4px rgba(0,0,0,.06); position:relative; border-left:4px solid #6366f1; }
.memo-card-title { font-size:16px; font-weight:700; color:#1e293b; padding-right:60px; }
.memo-card-body { font-size:14px; color:#64748b; line-height:1.7; white-space:pre-wrap; word-break:break-all; margin-top:8px; }
.memo-card-date { font-size:12px; color:#94a3b8; margin-top:10px; }
.memo-card-actions { display:flex; gap:4px; position:absolute; top:12px; right:10px; }


  </style>
</head>
<body>
<div id="app"></div>
<script>
const CATEGORIES = {
  income:  ["給与","副収入","賞与","投資","その他収入"],
  expense: ["食費","外食","日用品","交通費","住居費","光熱費","通信費","医療費","衣類","娯楽","教育","その他支出"]
};
const CAT_COLORS = {
  給与:{bg:"#d1fae5",text:"#065f46",dot:"#10b981"},副収入:{bg:"#ccfbf1",text:"#0f766e",dot:"#14b8a6"},
  賞与:{bg:"#dcfce7",text:"#166534",dot:"#22c55e"},投資:{bg:"#cffafe",text:"#155e75",dot:"#06b6d4"},
  その他収入:{bg:"#e0f2fe",text:"#075985",dot:"#0ea5e9"},食費:{bg:"#ffedd5",text:"#9a3412",dot:"#f97316"},
  外食:{bg:"#fef3c7",text:"#92400e",dot:"#f59e0b"},日用品:{bg:"#fefce8",text:"#713f12",dot:"#eab308"},
  交通費:{bg:"#dbeafe",text:"#1e40af",dot:"#3b82f6"},住居費:{bg:"#e0e7ff",text:"#3730a3",dot:"#6366f1"},
  光熱費:{bg:"#ede9fe",text:"#5b21b6",dot:"#8b5cf6"},通信費:{bg:"#f3e8ff",text:"#6b21a8",dot:"#a855f7"},
  医療費:{bg:"#ffe4e6",text:"#9f1239",dot:"#f43f5e"},衣類:{bg:"#fce7f3",text:"#9d174d",dot:"#ec4899"},
  娯楽:{bg:"#fae8ff",text:"#86198f",dot:"#d946ef"},教育:{bg:"#ecfccb",text:"#3f6212",dot:"#84cc16"},
  その他支出:{bg:"#f1f5f9",text:"#475569",dot:"#94a3b8"},
};
function catColor(cat){return CAT_COLORS[cat]||{bg:"#f3f4f6",text:"#6b7280",dot:"#9ca3af"};}
function nanoid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36);}
function formatYen(n){return new Intl.NumberFormat("ja-JP",{style:"currency",currency:"JPY",maximumFractionDigits:0}).format(n);}
function fmtDateShort(s){const d=new Date(s+"T00:00:00");return new Intl.DateTimeFormat("ja-JP",{month:"numeric",day:"numeric",weekday:"short"}).format(d);}
function todayStr(){return new Date().toISOString().slice(0,10);}
function currentYM(){const n=new Date();return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0");}
function currentYear(){return String(new Date().getFullYear());}
function ymLabel(ym){const [y,m]=ym.split("-");return y+"年"+parseInt(m)+"月";}
function addMonths(ym,d){const [y,m]=ym.split("-").map(Number);const dt=new Date(y,m-1+d,1);return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0");}

const TX_KEY=“kakeibo_tx_v3”, BDG_KEY=“kakeibo_budget_v3”, MEMO_KEY=“kakeibo_memo_v1”;

function loadTx(){
try{const r=localStorage.getItem(TX_KEY);if(!r)return[];const a=JSON.parse(r);if(!Array.isArray(a))return[];
return a.filter(t=>t&&typeof t===“object”).map(t=>({id:t.id||nanoid(),type:t.type===“income”||t.type===“expense”?t.type:“expense”,amount:Number(t.amount)||0,category:typeof t.category===“string”?t.category:””,memo:typeof t.memo===“string”?t.memo:””,date:typeof t.date===“string”?t.date:todayStr(),createdAt:typeof t.createdAt===“number”?t.createdAt:Date.now()}));}catch{return[];}
}
function saveTx(a){try{localStorage.setItem(TX_KEY,JSON.stringify(a));}catch{}}
function loadBdg(){try{return JSON.parse(localStorage.getItem(BDG_KEY)||”{}”);}catch{return{};}}
function saveBdg(b){try{localStorage.setItem(BDG_KEY,JSON.stringify(b));}catch{}}
function loadMemos(){
try{const r=localStorage.getItem(MEMO_KEY);if(!r)return[];const a=JSON.parse(r);if(!Array.isArray(a))return[];
return a.filter(m=>m&&typeof m===“object”).map(m=>({id:m.id||nanoid(),title:typeof m.title===“string”?m.title:””,body:typeof m.body===“string”?m.body:””,date:typeof m.date===“string”?m.date:todayStr(),createdAt:typeof m.createdAt===“number”?m.createdAt:Date.now()}));}catch{return[];}
}
function saveMemos(a){try{localStorage.setItem(MEMO_KEY,JSON.stringify(a));}catch{}}

const state={
transactions:loadTx(), memos:loadMemos(),
yearMonth:currentYM(), tab:“list”, catType:“expense”, graphYear:currentYear(),
budget:loadBdg(), showAdd:false, editTx:null, confirmId:null,
showBudgetEdit:false, showMemoAdd:false, editMemo:null, confirmMemoId:null,
budgetDraft:{}
};
function setState(patch){Object.assign(state,typeof patch===“function”?patch(state):patch);render();}

function monthly(){return state.transactions.filter(t=>t.date.startsWith(state.yearMonth)).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt);}
function summary(){const m=monthly();const income=m.filter(t=>t.type===“income”).reduce((s,t)=>s+t.amount,0);const expense=m.filter(t=>t.type===“expense”).reduce((s,t)=>s+t.amount,0);return{income,expense,balance:income-expense};}
function catBreakdown(type){const map={};monthly().filter(t=>t.type===type).forEach(t=>{if(!map[t.category])map[t.category]={amount:0,count:0};map[t.category].amount+=t.amount;map[t.category].count+=1;});return Object.entries(map).map(([cat,v])=>({cat,amount:v.amount,count:v.count,color:catColor(cat)})).sort((a,b)=>b.amount-a.amount);}
function groupedByDate(){const map={};monthly().forEach(t=>{(map[t.date]=map[t.date]||[]).push(t);});return Object.entries(map).sort(([a],[b])=>b.localeCompare(a));}
function totalBudget(){return Object.values(state.budget).reduce((s,v)=>s+v,0);}
function balanceMsg(income,expense,balance){const tb=totalBudget();if(tb>0&&expense>tb)return[“⚠️ 今月の予算を超えました！”,”#f43f5e”];if(tb>0&&expense/tb>0.8)return[“⚠️ 予算の80%を超えています。注意！”,”#f59e0b”];if(income===0&&expense===0)return[“収支を記録してみましょう📝”,”#6b7280”];if(balance<0)return[“今月は支出が収入を超えています💦”,”#6b7280”];const r=income>0?expense/income:0;if(r<0.5)return[“いいペースです😊 このままいきましょう！”,”#6b7280”];if(r<0.8)return[“もう少し節約できると◎ 頑張って！”,”#6b7280”];return[“支出が多めです🔥 残りの使い方に注意！”,”#6b7280”];}

function addTx(data){const tx={id:nanoid(),createdAt:Date.now(),…data,amount:Number(data.amount)};const txs=[tx,…state.transactions];saveTx(txs);setState({transactions:txs,showAdd:false});}
function updateTx(id,data){const txs=state.transactions.map(t=>t.id!==id?t:{…t,…data,type:data.type===“income”||data.type===“expense”?data.type:t.type,amount:data.amount!==undefined?Number(data.amount):t.amount,id:t.id,createdAt:t.createdAt});saveTx(txs);setState({transactions:txs,editTx:null});}
function deleteTx(id){const txs=state.transactions.filter(t=>t.id!==id);saveTx(txs);setState({transactions:txs,confirmId:null});}
function saveBudgetAction(b){saveBdg(b);setState({budget:b,showBudgetEdit:false});}
function addMemo(data){const m={id:nanoid(),createdAt:Date.now(),…data};const memos=[m,…state.memos];saveMemos(memos);setState({memos,showMemoAdd:false});}
function updateMemo(id,data){const memos=state.memos.map(m=>m.id!==id?m:{…m,…data});saveMemos(memos);setState({memos,editMemo:null});}
function deleteMemo(id){const memos=state.memos.filter(m=>m.id!==id);saveMemos(memos);setState({memos,confirmMemoId:null});}

function el(tag,attrs={},children=[]){const e=document.createElement(tag);for(const [k,v] of Object.entries(attrs)){if(k===“style”&&typeof v===“object”)Object.assign(e.style,v);else if(k.startsWith(“on”)&&typeof v===“function”)e.addEventListener(k.slice(2).toLowerCase(),v);else if(k===“className”)e.className=v;else e.setAttribute(k,v);}children.forEach(c=>{if(c==null)return;e.appendChild(typeof c===“string”?document.createTextNode(c):c);});return e;}
function div(attrs,children){return el(“div”,attrs,children);}
function btn(attrs,children){return el(“button”,attrs,children);}
function span(attrs,children){return el(“span”,attrs,children);}
function inp(attrs){return el(“input”,attrs);}
function txt(s){return document.createTextNode(s);}

function CatBadge(cat){const c=catColor(cat);return span({className:“cat-badge”,style:{background:c.bg,color:c.text}},[span({className:“cat-dot”,style:{background:c.dot}}),txt(cat)]);}

function FormModal(initial){
const isEdit=!!initial;
let fd=isEdit?{type:initial.type,amount:String(initial.amount),category:initial.category,memo:initial.memo,date:initial.date}:{type:“expense”,amount:””,category:CATEGORIES.expense[0],memo:””,date:todayStr()};
function FormInner(fd,isEdit){
const isIncome=fd.type===“income”;const cats=CATEGORIES[fd.type];
const typeToggle=div({className:“type-toggle”},[…[“expense”,“income”].map(t=>{const active=fd.type===t;const b=btn({className:“type-btn”,style:{background:active?(t===“income”?”#10b981”:”#f43f5e”):“transparent”,color:active?”#fff”:”#64748b”}},[txt(t===“income”?“収入”:“支出”)]);b.addEventListener(“click”,()=>{fd.type=t;if(!CATEGORIES[t].includes(fd.category))fd.category=CATEGORIES[t][0];sheet.replaceWith(FormInner(fd,isEdit));});return b;})]);
const amountInp=inp({type:“number”,className:“form-input”,placeholder:“例：3000”,inputmode:“numeric”,value:fd.amount});amountInp.addEventListener(“input”,e=>fd.amount=e.target.value);
const catChips=div({className:“cat-chips”},cats.map(cat=>{const c=catColor(cat);const sel=fd.category===cat;const b=btn({className:“cat-chip”,style:{border:sel?`2px solid ${c.dot}`:“1.5px solid #e2e8f0”,background:sel?c.bg:”#fff”,color:sel?c.text:”#64748b”,fontWeight:sel?“700”:“400”}},[txt(cat)]);b.addEventListener(“click”,()=>{fd.category=cat;sheet.replaceWith(FormInner(fd,isEdit));});return b;}));
const dateInp=inp({type:“date”,className:“form-input”,value:fd.date});dateInp.addEventListener(“change”,e=>fd.date=e.target.value);
const memoInp=inp({type:“text”,className:“form-input”,placeholder:“例：スーパーで買い物”,value:fd.memo});memoInp.addEventListener(“input”,e=>fd.memo=e.target.value);
const submitB=btn({className:“submit-btn”,style:{background:isIncome?”#10b981”:”#f43f5e”}},[txt(isEdit?“更新する”:“追加する”)]);
submitB.addEventListener(“click”,()=>{const amt=Number(fd.amount);if(!amt||amt<=0){showToast(“金額を入力してください”);return;}if(isEdit)updateTx(initial.id,{type:fd.type,amount:amt,category:fd.category,memo:fd.memo,date:fd.date});else addTx({type:fd.type,amount:amt,category:fd.category,memo:fd.memo,date:fd.date});});
const sheet=div({style:{display:“flex”,flexDirection:“column”,gap:“16px”}},[typeToggle,div({},[el(“label”,{className:“form-label”},[txt(“金額（円）”)]),amountInp]),div({},[el(“label”,{className:“form-label”},[txt(“カテゴリ”)]),catChips]),div({},[el(“label”,{className:“form-label”},[txt(“日付”)]),dateInp]),div({},[el(“label”,{className:“form-label”},[txt(“メモ（任意）”)]),memoInp]),submitB]);
return sheet;
}
const closeBtn=btn({className:“modal-close”},[txt(“✕”)]);closeBtn.addEventListener(“click”,()=>setState({showAdd:false,editTx:null}));
const sheet=div({className:“modal-sheet”},[div({className:“modal-header”},[span({className:“modal-title”},[txt(isEdit?“明細を編集”:“収支を追加”)]),closeBtn]),FormInner(fd,isEdit)]);
const overlay=div({className:“modal-overlay”,id:“form-overlay”},[sheet]);overlay.addEventListener(“click”,e=>{if(e.target===overlay)setState({showAdd:false,editTx:null});});return overlay;
}

function MemoModal(initial){
const isEdit=!!initial;
let fd={title:isEdit?initial.title:””,body:isEdit?initial.body:””,date:isEdit?initial.date:todayStr()};
const titleInp=inp({type:“text”,className:“form-input”,placeholder:“タイトル（例：カード引き落とし）”,value:fd.title});titleInp.addEventListener(“input”,e=>fd.title=e.target.value);
