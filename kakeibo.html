<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>かんたん家計簿</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="かんたん家計簿">
  <meta name="theme-color" content="#10b981">
  <style>
    *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
    html,body{height:100%;background:#f5f5f0;font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif}
    input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
    input,button,textarea{font-family:inherit}
    @keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    #app{max-width:480px;margin:0 auto;min-height:100vh;position:relative}
    .header{background:#fff;padding:14px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #f1f5f9;position:sticky;top:0;z-index:10}
    .header-main{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
    .header-logo{width:36px;height:36px;border-radius:10px;background:#10b981;display:flex;align-items:center;justify-content:center;font-size:18px}
    .header-title{font-weight:800;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .nav-btn{background:none;border:none;font-size:22px;cursor:pointer;color:#94a3b8;padding:0 6px}
    .header-nav{display:flex;align-items:center;gap:4px;flex-shrink:0}
    .nav-label{font-weight:700;font-size:14px;min-width:72px;text-align:center}
    .content{padding:14px 14px 100px}
    .card{background:#fff;border-radius:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
    .summary-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}
    .summary-card{background:#fff;border-radius:16px;padding:14px 10px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
    .summary-label{font-size:12px;color:#94a3b8;font-weight:600}
    .summary-icon{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px}
    .summary-value{font-weight:800;font-size:15px;letter-spacing:-0.5px;margin-top:8px}
    /* カード・繰越情報ストリップ */
    .info-strip{background:#f8fafc;border-radius:12px;padding:8px 12px;margin-bottom:10px;display:flex;flex-direction:column;gap:5px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
    .info-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#64748b}
    .info-row-label{display:flex;align-items:center;gap:5px}
    .info-row-value{font-weight:700}
    .banner{background:#fff;border-radius:16px;padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
    .banner-amount{font-weight:800;font-size:22px}
    .banner-msg{font-size:13px;color:#6b7280;margin-top:5px}
    .progress-bar-bg{background:#f1f5f9;border-radius:6px;height:8px;overflow:hidden;margin-top:8px}
    .progress-bar{height:100%;border-radius:6px;transition:width .6s ease}
    .tabs{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;background:#fff;border-radius:14px;padding:4px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);gap:4px;scrollbar-width:none}
    .tabs::-webkit-scrollbar{display:none}
    .tab-btn{flex:0 0 auto;min-width:72px;padding:10px 10px;border-radius:10px;border:none;cursor:pointer;font-weight:600;font-size:12px;color:#94a3b8;background:transparent;transition:all .2s;white-space:nowrap}
    .tab-btn.active{background:#f1f5f9;font-weight:700;color:#1e293b}
    .date-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;padding:0 4px}
    .date-label{font-size:13px;color:#64748b;font-weight:600}
    .tx-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
    .tx-row{background:#fff;border-radius:14px;padding:11px 13px;display:flex;align-items:center;gap:8px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
    .tx-row.card-tx{background:#f5f3ff;border:1px solid #e0e7ff}
    /* 先月カード引き落とし行 */
    .prev-card-row{background:#fff;border-radius:14px;padding:11px 13px;display:flex;align-items:center;gap:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1.5px solid #e0e7ff;margin-bottom:8px}
    .cat-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;flex-shrink:0}
    .cat-dot{width:7px;height:7px;border-radius:50%;display:inline-block}
    .tx-memo{flex:1;font-size:14px;color:#374151;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .tx-memo.card-memo{color:#6366f1}
    .tx-amount{font-weight:700;font-size:15px;white-space:nowrap}
    .card-sub{font-size:11px;color:#6366f1;font-weight:600}
    .icon-btn{background:none;border:none;cursor:pointer;font-size:15px;color:#cbd5e1;padding:0 1px;flex-shrink:0}
    .cat-row{margin-bottom:14px}
    .cat-row-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
    .fab{position:fixed;bottom:28px;right:calc(50% - 196px);width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;font-size:28px;color:#fff;display:flex;align-items:center;justify-content:center;z-index:20;transition:background .3s}
    .modal-overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
    .modal-sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:24px 20px 40px;animation:slideUp .25s ease}
    .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
    .modal-title{font-weight:700;font-size:17px}
    .modal-close{background:#f1f5f9;border:none;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:15px;color:#64748b}
    .form-label{display:block;font-size:13px;color:#64748b;margin-bottom:6px;font-weight:600}
    .form-input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid #e2e8f0;font-size:15px;background:#f8fafc;outline:none}
    .form-input:focus{border-color:#10b981}
    .form-textarea{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid #e2e8f0;font-size:15px;background:#f8fafc;outline:none;resize:none;min-height:120px;line-height:1.7}
    .form-textarea:focus{border-color:#6366f1}
    .type-toggle{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%;background:#f1f5f9;border-radius:12px;padding:4px;gap:4px;margin-bottom:16px}
    .type-btn{display:block;width:100%;min-width:0;padding:10px 0;border-radius:9px;border:none;cursor:pointer;font-weight:700;font-size:14px;background:transparent;color:#64748b;transition:all .2s;text-align:center}
    /* カード払いトグル */
    .card-toggle-wrap{margin-bottom:16px}
    .card-toggle-btn{width:100%;padding:11px 0;border-radius:12px;border:1.5px solid #e0e7ff;background:#f5f3ff;color:#6366f1;font-weight:700;font-size:14px;cursor:pointer;transition:all .2s}
    .card-toggle-btn.off{background:#f1f5f9;border-color:#e2e8f0;color:#94a3b8}
    .card-note-box{background:#ede9fe;border-radius:10px;padding:8px 12px;font-size:12px;color:#5b21b6;margin-top:8px;line-height:1.6}
    .cat-chips{display:flex;flex-wrap:wrap;gap:8px}
    .cat-chip{padding:7px 13px;border-radius:20px;border:1.5px solid #e2e8f0;background:#fff;color:#64748b;font-size:13px;cursor:pointer}
    .submit-btn{width:100%;padding:14px 0;border-radius:14px;border:none;color:#fff;font-weight:800;font-size:16px;cursor:pointer;margin-top:4px}
    .confirm-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
    .confirm-box{background:#fff;border-radius:18px;padding:24px 24px 20px;width:280px;box-shadow:0 8px 32px rgba(0,0,0,.18);animation:fadeIn .15s}
    .confirm-msg{font-size:15px;color:#1e293b;margin-bottom:20px;text-align:center;font-weight:600}
    .confirm-btns{display:flex;gap:10px}
    .confirm-cancel{flex:1;padding:11px 0;border-radius:12px;border:1.5px solid #e2e8f0;background:#fff;color:#64748b;font-weight:600;font-size:14px;cursor:pointer}
    .confirm-ok{flex:1;padding:11px 0;border-radius:12px;border:none;background:#f43f5e;color:#fff;font-weight:700;font-size:14px;cursor:pointer}
    .empty{text-align:center;padding:60px 0;color:#94a3b8}
    .empty-icon{font-size:40px;margin-bottom:10px}
    .sub-tabs{display:flex;background:#fff;border-radius:14px;padding:4px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
    .sub-tab{flex:1;padding:9px 0;border-radius:11px;border:none;cursor:pointer;font-weight:500;font-size:14px;background:transparent;color:#94a3b8;transition:all .2s}
    .graph-bar-wrap{display:flex;align-items:flex-end;gap:4px;overflow-x:auto}
    .graph-month{flex:1;min-width:22px;display:flex;flex-direction:column;align-items:center;gap:3px}
    .graph-bars{display:flex;align-items:flex-end;gap:2px}
    .graph-bar{width:9px;border-radius:3px 3px 0 0;transition:height .5s ease}
    .graph-mlabel{font-size:10px;color:#94a3b8;margin-top:2px}
    .graph-totals{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid #f1f5f9}
    .graph-total-item{text-align:center}
    .graph-total-label{font-size:11px;color:#94a3b8;margin-bottom:3px}
    .graph-total-value{font-size:13px;font-weight:700}
    .budget-edit-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    .budget-cat-name{display:flex;align-items:center;gap:6px;width:90px;flex-shrink:0;font-size:13px;font-weight:600}
    .memo-card{background:#fff;border-radius:16px;padding:16px 16px 14px;box-shadow:0 1px 4px rgba(0,0,0,.06);position:relative;border-left:4px solid #6366f1}
    .memo-card-title{font-size:16px;font-weight:700;color:#1e293b;padding-right:60px}
    .memo-card-body{font-size:14px;color:#64748b;line-height:1.7;white-space:pre-wrap;word-break:break-all;margin-top:8px}
    .memo-card-date{font-size:12px;color:#94a3b8;margin-top:10px}
    .memo-card-actions{display:flex;gap:4px;position:absolute;top:12px;right:10px}
    .goal-stack{display:flex;flex-direction:column;gap:12px}
    .goal-hero{padding:18px}
    .goal-title{font-size:17px;font-weight:800;color:#1e293b}
    .goal-sub{font-size:13px;color:#64748b;margin-top:6px;line-height:1.6}
    .goal-metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
    .goal-metric{background:#f8fafc;border-radius:14px;padding:12px}
    .goal-metric-label{font-size:12px;color:#94a3b8;font-weight:600}
    .goal-metric-value{font-size:16px;font-weight:800;color:#1e293b;margin-top:6px}
    .goal-note{margin-top:12px;padding:12px;border-radius:14px;background:#f8fafc;font-size:13px;color:#475569;line-height:1.7;white-space:pre-wrap}
    .advice-list{display:flex;flex-direction:column;gap:10px}
    .advice-item{padding:12px 14px;border-radius:14px;background:#f8fafc;font-size:13px;color:#475569;line-height:1.7}
    .score-ring{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:#1e293b;background:conic-gradient(#10b981 0deg,#10b981 240deg,#e2e8f0 240deg)}
    .diagnosis-header{display:flex;align-items:center;justify-content:space-between;gap:14px}
    .diagnosis-copy{flex:1}
    .diagnosis-title{font-size:16px;font-weight:800;color:#1e293b}
    .diagnosis-text{font-size:13px;color:#64748b;line-height:1.7;margin-top:6px}
    .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
    .info-chip{padding:7px 11px;border-radius:999px;background:#f1f5f9;color:#475569;font-size:12px;font-weight:600}
  </style>
</head>
<body>
<div id="app"></div>
<script>
var CATEGORIES = {
  income: ["給与","副収入","賞与","投資","その他収入"],
  expense: ["食費","外食","日用品","交通費","住居費","光熱費","通信費","医療費","衣類","娯楽","教育","その他支出"]
};
var CAT_COLORS = {
  "給与":{bg:"#d1fae5",text:"#065f46",dot:"#10b981"},
  "副収入":{bg:"#ccfbf1",text:"#0f766e",dot:"#14b8a6"},
  "賞与":{bg:"#dcfce7",text:"#166534",dot:"#22c55e"},
  "投資":{bg:"#cffafe",text:"#155e75",dot:"#06b6d4"},
  "その他収入":{bg:"#e0f2fe",text:"#075985",dot:"#0ea5e9"},
  "食費":{bg:"#ffedd5",text:"#9a3412",dot:"#f97316"},
  "外食":{bg:"#fef3c7",text:"#92400e",dot:"#f59e0b"},
  "日用品":{bg:"#fefce8",text:"#713f12",dot:"#eab308"},
  "交通費":{bg:"#dbeafe",text:"#1e40af",dot:"#3b82f6"},
  "住居費":{bg:"#e0e7ff",text:"#3730a3",dot:"#6366f1"},
  "光熱費":{bg:"#ede9fe",text:"#5b21b6",dot:"#8b5cf6"},
  "通信費":{bg:"#f3e8ff",text:"#6b21a8",dot:"#a855f7"},
  "医療費":{bg:"#ffe4e6",text:"#9f1239",dot:"#f43f5e"},
  "衣類":{bg:"#fce7f3",text:"#9d174d",dot:"#ec4899"},
  "娯楽":{bg:"#fae8ff",text:"#86198f",dot:"#d946ef"},
  "教育":{bg:"#ecfccb",text:"#3f6212",dot:"#84cc16"},
  "その他支出":{bg:"#f1f5f9",text:"#475569",dot:"#94a3b8"}
};

function catColor(cat) { return CAT_COLORS[cat] || {bg:"#f3f4f6",text:"#6b7280",dot:"#9ca3af"}; }
function nanoid() { return Math.random().toString(36).slice(2,9) + Date.now().toString(36); }
function formatYen(n) { return new Intl.NumberFormat("ja-JP",{style:"currency",currency:"JPY",maximumFractionDigits:0}).format(n); }
function fmtDateShort(s) { var d = new Date(s+"T00:00:00"); return new Intl.DateTimeFormat("ja-JP",{month:"numeric",day:"numeric",weekday:"short"}).format(d); }
function todayStr() { return new Date().toISOString().slice(0,10); }
function currentYM() { var n = new Date(); return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0"); }
function currentYear() { return String(new Date().getFullYear()); }
function ymLabel(ym) { var p = ym.split("-"); return p[0]+"年"+parseInt(p[1])+"月"; }
function addMonths(ym, d) { var p = ym.split("-").map(Number); var dt = new Date(p[0], p[1]-1+d, 1); return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0"); }

var TX_KEY = "kakeibo_tx_v3";
var BDG_KEY = "kakeibo_budget_v3";
var MEMO_KEY = "kakeibo_memo_v1";
var GOAL_KEY = "kakeibo_goal_v1";

function loadTx() {
  try {
    var r = localStorage.getItem(TX_KEY);
    if (!r) return [];
    var a = JSON.parse(r);
    if (!Array.isArray(a)) return [];
    return a.filter(function(t){return t&&typeof t==="object";}).map(function(t){
      return {
        id: t.id||nanoid(),
        type: t.type==="income"||t.type==="expense"?t.type:"expense",
        amount: Number(t.amount)||0,
        category: typeof t.category==="string"?t.category:"",
        memo: typeof t.memo==="string"?t.memo:"",
        date: typeof t.date==="string"?t.date:todayStr(),
        createdAt: typeof t.createdAt==="number"?t.createdAt:Date.now(),
        isCard: !!t.isCard   // ★ カード払いフラグ
      };
    });
  } catch(e) { return []; }
}
function saveTx(a) { try { localStorage.setItem(TX_KEY, JSON.stringify(a)); } catch(e){} }
function loadBdg() { try { return JSON.parse(localStorage.getItem(BDG_KEY)||"{}"); } catch(e) { return {}; } }
function saveBdg(b) { try { localStorage.setItem(BDG_KEY, JSON.stringify(b)); } catch(e){} }
function loadMemos() {
  try {
    var r = localStorage.getItem(MEMO_KEY);
    if (!r) return [];
    var a = JSON.parse(r);
    if (!Array.isArray(a)) return [];
    return a.filter(function(m){return m&&typeof m==="object";}).map(function(m){
      return {
        id: m.id||nanoid(),
        title: typeof m.title==="string"?m.title:"",
        body: typeof m.body==="string"?m.body:"",
        date: typeof m.date==="string"?m.date:todayStr(),
        createdAt: typeof m.createdAt==="number"?m.createdAt:Date.now()
      };
    });
  } catch(e) { return []; }
}
function saveMemos(a) { try { localStorage.setItem(MEMO_KEY, JSON.stringify(a)); } catch(e){} }
function loadGoal() {
  try {
    var raw = localStorage.getItem(GOAL_KEY);
    if (!raw) return null;
    var g = JSON.parse(raw);
    if (!g || typeof g !== "object") return null;
    return {
      title: typeof g.title === "string" ? g.title : "",
      targetAmount: Number(g.targetAmount) || 0,
      currentAmount: Number(g.currentAmount) || 0,
      targetDate: typeof g.targetDate === "string" ? g.targetDate : "",
      monthlySaving: Number(g.monthlySaving) || 0,
      note: typeof g.note === "string" ? g.note : ""
    };
  } catch(e) { return null; }
}
function saveGoal(goal) { try { localStorage.setItem(GOAL_KEY, JSON.stringify(goal)); } catch(e){} }

var state = {
  transactions: loadTx(),
  memos: loadMemos(),
  yearMonth: currentYM(),
  tab: "list",
  catType: "expense",
  graphYear: currentYear(),
  budget: loadBdg(),
  goal: loadGoal(),
  showAdd: false,
  editTx: null,
  confirmId: null,
  showBudgetEdit: false,
  showMemoAdd: false,
  editMemo: null,
  confirmMemoId: null,
  showGoalEdit: false,
  budgetDraft: {}
};

function setState(patch) {
  if (typeof patch === "function") { patch = patch(state); }
  Object.assign(state, patch);
  render();
}

function monthly() {
  return state.transactions
    .filter(function(t){ return t.date.startsWith(state.yearMonth); })
    .sort(function(a,b){ return b.date.localeCompare(a.date)||b.createdAt-a.createdAt; });
}

// ★ 前月のカード払い合計（今月の支出として計上）
function getPrevCardTotal(ym) {
  var prevYm = addMonths(ym, -1);
  return state.transactions
    .filter(function(t){ return t.date.startsWith(prevYm) && t.type==="expense" && t.isCard; })
    .reduce(function(s,t){ return s+t.amount; }, 0);
}

// ★ 今月のカード払い合計（来月に引き落とし予定）
function getCurrentCardTotal(ym) {
  return state.transactions
    .filter(function(t){ return t.date.startsWith(ym) && t.type==="expense" && t.isCard; })
    .reduce(function(s,t){ return s+t.amount; }, 0);
}

// ★ 前月繰越を計算（全履歴から累積）
function computeCarryover(targetYm) {
  var seen = {};
  state.transactions.forEach(function(t){
    var ym = t.date.slice(0,7);
    if (ym < targetYm) seen[ym] = true;
  });
  var allYms = Object.keys(seen).sort();
  var running = 0;
  allYms.forEach(function(ym){
    var prevYm = addMonths(ym, -1);
    var txs = state.transactions.filter(function(t){ return t.date.startsWith(ym); });
    var prevTxs = state.transactions.filter(function(t){ return t.date.startsWith(prevYm); });
    var inc = txs.filter(function(t){ return t.type==="income"; }).reduce(function(s,t){return s+t.amount;},0);
    var exp = txs.filter(function(t){ return t.type==="expense" && !t.isCard; }).reduce(function(s,t){return s+t.amount;},0);
    var prevCard = prevTxs.filter(function(t){ return t.type==="expense" && t.isCard; }).reduce(function(s,t){return s+t.amount;},0);
    running += inc - exp - prevCard;
  });
  return running;
}

// ★ 修正されたsummary（前月繰越・カード翌月計上を反映）
function summary() {
  var m = monthly();
  var ym = state.yearMonth;
  var income = m.filter(function(t){return t.type==="income";}).reduce(function(s,t){return s+t.amount;},0);
  var rawExpense = m.filter(function(t){return t.type==="expense" && !t.isCard;}).reduce(function(s,t){return s+t.amount;},0);
  var prevCard = getPrevCardTotal(ym);
  var currentCard = getCurrentCardTotal(ym);
  var carryover = computeCarryover(ym);
  var totalExpense = rawExpense + prevCard;
  var balance = carryover + income - totalExpense;
  return {
    income: income,
    expense: totalExpense,
    balance: balance,
    carryover: carryover,
    prevCard: prevCard,
    currentCard: currentCard,
    rawExpense: rawExpense
  };
}

function catBreakdown(type) {
  var map = {};
  var ym = state.yearMonth;
  // 今月の通常取引（カード除く）
  monthly().filter(function(t){ return t.type===type && !t.isCard; }).forEach(function(t){
    if (!map[t.category]) map[t.category] = {amount:0,count:0};
    map[t.category].amount += t.amount;
    map[t.category].count += 1;
  });
  // ★ 支出の場合、前月カード分も含める
  if (type==="expense") {
    var prevYm = addMonths(ym, -1);
    state.transactions.filter(function(t){ return t.date.startsWith(prevYm) && t.type==="expense" && t.isCard; }).forEach(function(t){
      if (!map[t.category]) map[t.category] = {amount:0,count:0};
      map[t.category].amount += t.amount;
      map[t.category].count += 1;
    });
  }
  return Object.entries(map).map(function(e){
    return {cat:e[0], amount:e[1].amount, count:e[1].count, color:catColor(e[0])};
  }).sort(function(a,b){return b.amount-a.amount;});
}

function groupedByDate() {
  var map = {};
  monthly().forEach(function(t){
    if (!map[t.date]) map[t.date] = [];
    map[t.date].push(t);
  });
  return Object.entries(map).sort(function(a,b){return b[0].localeCompare(a[0]);});
}

function totalBudget() { return Object.values(state.budget).reduce(function(s,v){return s+v;},0); }
function monthDiffFromNow(targetDate) {
  if (!targetDate) return 0;
  var now = new Date();
  var target = new Date(targetDate+"T00:00:00");
  var months = (target.getFullYear()-now.getFullYear())*12 + (target.getMonth()-now.getMonth());
  if (target.getDate() >= now.getDate()) months += 1;
  return Math.max(months, 0);
}

function averageRecentBalance(monthCount) {
  var total = 0;
  var count = 0;
  for (var i = 0; i < monthCount; i += 1) {
    var ym = addMonths(currentYM(), -i);
    var txs = state.transactions.filter(function(t){ return t.date.startsWith(ym); });
    if (txs.length===0) continue;
    var income = txs.filter(function(t){return t.type==="income";}).reduce(function(s,t){return s+t.amount;},0);
    var expense = txs.filter(function(t){return t.type==="expense"&&!t.isCard;}).reduce(function(s,t){return s+t.amount;},0);
    var prevCard = getPrevCardTotal(ym);
    total += income - expense - prevCard;
    count += 1;
  }
  return count ? total / count : 0;
}

function getGoalProjection(goal) {
  if (!goal) return null;
  var monthsLeft = monthDiffFromNow(goal.targetDate);
  var remaining = Math.max(goal.targetAmount - goal.currentAmount, 0);
  var requiredMonthly = monthsLeft > 0 ? Math.ceil(remaining / monthsLeft) : remaining;
  var avgBalance = averageRecentBalance(3);
  var plannedMonthly = goal.monthlySaving > 0 ? goal.monthlySaving : avgBalance;
  var projectedTotal = goal.currentAmount + Math.max(plannedMonthly, 0) * monthsLeft;
  var progress = goal.targetAmount > 0 ? Math.min((goal.currentAmount / goal.targetAmount) * 100, 100) : 0;
  var completionRate = goal.targetAmount > 0 ? Math.min((projectedTotal / goal.targetAmount) * 100, 999) : 0;
  return {
    monthsLeft: monthsLeft,
    remaining: remaining,
    requiredMonthly: requiredMonthly,
    avgBalance: avgBalance,
    plannedMonthly: plannedMonthly,
    projectedTotal: projectedTotal,
    progress: progress,
    completionRate: completionRate
  };
}

function getDiagnosis() {
  var s = summary();
  var budget = totalBudget();
  var ratio = s.income > 0 ? s.expense / s.income : 1;
  var score = 50;
  if (s.balance > 0) score += 20;
  if (ratio <= 0.8) score += 15;
  else if (ratio > 1) score -= 15;
  if (budget > 0 && s.expense <= budget) score += 10;
  else if (budget > 0 && s.expense > budget) score -= 10;
  if (averageRecentBalance(3) > 0) score += 10;
  score = Math.max(0, Math.min(100, Math.round(score)));

  var tone = "おおむね安定しています。";
  if (score < 40) tone = "今月は見直し優先です。";
  else if (score < 70) tone = "少し整えるとかなり楽になります。";

  var points = [];
  if (s.balance < 0) points.push("今月の収支が赤字です。まずは固定費か食費を小さく見直すのが近道です。");
  else points.push("今月は黒字です。この余りを目標貯金に回す流れが作れています。");

  if (budget > 0) {
    if (s.expense > budget) points.push("設定予算を超えています。使い過ぎカテゴリを1つだけ決めて来月は先に上限を置くのがおすすめです。");
    else points.push("予算内で動けています。今の配分をベースに目標別の積立額を決めやすい状態です。");
  } else {
    points.push("予算が未設定です。まずは食費・日用品・娯楽の3つだけでも上限を決めると管理しやすくなります。");
  }

  var expenses = catBreakdown("expense");
  if (expenses.length > 0) points.push("一番大きい支出は「" + expenses[0].cat + "」です。ここを基準に見直すと効果が出やすいです。");
  else points.push("支出データが増えるほど診断が正確になります。数日分だけでも続けると傾向が見えてきます。");

  return {
    score: score,
    tone: tone,
    points: points,
    ratio: ratio,
    avgBalance: averageRecentBalance(3)
  };
}

function balanceMsg(income, expense, balance) {

  if (tb>0 && expense>tb) return ["⚠️ 今月の予算を超えました！","#f43f5e"];

}

function el(tag, attrs, children) {
  attrs = attrs || {};
  children = children || [];
  var e = document.createElement(tag);
  Object.entries(attrs).forEach(function(kv){
    var k = kv[0]; var v = kv[1];
    if (k==="style" && typeof v==="object") { Object.assign(e.style, v); }
    else if (k.startsWith("on") && typeof v==="function") { e.addEventListener(k.slice(2).toLowerCase(), v); }
    else if (k==="className") { e.className = v; }
    else { e.setAttribute(k, v); }
  });
  children.forEach(function(c){
    if (c==null) return;
    e.appendChild(typeof c==="string"?document.createTextNode(c):c);
  });
  return e;
}

  var carryover = s.carryover; var prevCard = s.prevCard; var currentCard = s.currentCard;
  var tb = totalBudget();
  var budgetOver = tb>0&&expense>tb;
  var budgetWarn = tb>0&&!budgetOver&&expense/tb>0.8;
  var bm = balanceMsg(income,expense,balance);
  var msg = bm[0]; var msgColor = bm[1];

  var app = document.getElementById("app");
  app.replaceChildren();
  var root = div({id:"app-inner"}, []);

  var prevBtn = btn({className:"nav-btn"}, [txt("‹")]);
  prevBtn.addEventListener("click", function(){ setState({yearMonth:addMonths(state.yearMonth,-1)}); });
  var nextBtn = btn({className:"nav-btn"}, [txt("›")]);

    isMemoTab
      ? span({style:{fontSize:"14px",color:"#6366f1",fontWeight:"700"}}, [txt("📝 覚え書き")])
      : div({className:"header-nav"}, [
          prevBtn,
          span({className:"nav-label"}, [txt(ymLabel(state.yearMonth))]),
          nextBtn
        ])

  var content = div({className:"content"}, []);

  if (!isMemoTab) {
    var summaryGrid = div({className:"summary-grid"}, [
      {label:"収入",value:income,color:"#10b981",icon:"📈",ibg:"#d1fae5"},
      {label:"支出",value:expense,color:"#f43f5e",icon:"📉",ibg:budgetOver?"#fecdd3":"#ffe4e6"},

      infoRows.push(div({className:"info-row"}, [
        div({className:"info-row-label"}, [txt("🔄 前月繰越")]),
        span({className:"info-row-value",style:{color:carryover>=0?"#10b981":"#f43f5e"}}, [
          txt((carryover>=0?"+":"")+formatYen(carryover))
        ])
      ]));
    }
    if (prevCard > 0) {
      infoRows.push(div({className:"info-row"}, [
        div({className:"info-row-label"}, [txt("💳 先月カード引き落とし")]),
        span({className:"info-row-value",style:{color:"#f43f5e"}}, [txt("-"+formatYen(prevCard))])
      ]));
    }

    ["graph","年間"],

    var b = btn({className:"tab-btn"+(state.tab===t[0]?" active":"")}, [txt(t[1])]);
    b.addEventListener("click", function(){ setState({tab:t[0]}); });
    return b;
  }));
  content.appendChild(tabsEl);

  var tabContent = div({style:{animation:"fadeIn .2s"}});

  if (state.tab==="list") {
    var groups = groupedByDate();

    // ★ 先月カード引き落とし行（仮想行）
    if (prevCard > 0) {
      var prevCardRow = div({className:"prev-card-row"}, [
        span({className:"cat-badge",style:{background:"#ede9fe",color:"#5b21b6",flexShrink:0}}, [

        ]),
        span({className:"tx-memo card-memo"}, [txt("先月のカード引き落とし")]),
        span({className:"tx-amount",style:{color:"#f43f5e"}}, [txt("-"+formatYen(prevCard))])
      ]);
      tabContent.appendChild(prevCardRow);

        div({}, [txt("まだ記録がありません")]),
        div({style:{fontSize:"13px",marginTop:"4px"}}, [txt("＋ボタンから追加しましょう")])
      ]));
    } else {
      groups.forEach(function(g){

        },0);
        tabContent.appendChild(div({className:"date-header"}, [

          span({style:{fontSize:"13px",fontWeight:"700",color:dayNet>=0?"#10b981":"#f43f5e"}}, [txt((dayNet>=0?"+":"")+formatYen(dayNet))])

        var list = div({className:"tx-list"});
        txs.forEach(function(tx){
          var editB = btn({className:"icon-btn"}, [txt("✏️")]);
          editB.addEventListener("click", function(){ setState({editTx:tx}); });
          var delB = btn({className:"icon-btn"}, [txt("🗑")]);
          delB.addEventListener("click", function(){ setState({confirmId:tx.id}); });

          var memoWrap = div({style:{flex:1,overflow:"hidden"}}, [
            span({className:"tx-memo"+(tx.isCard?" card-memo":"")}, [txt(tx.memo||tx.category)]),
            tx.isCard ? div({className:"card-sub"}, [txt("💳 来月引き落とし予定")]) : null
          ].filter(Boolean));

          list.appendChild(div({className:"tx-row"+(tx.isCard?" card-tx":"")}, [
            CatBadge(tx.category, tx.isCard),
            memoWrap,
            span({className:"tx-amount",style:{color:tx.isCard?"#8b5cf6":tx.type==="income"?"#10b981":"#f43f5e"}}, [
              txt(tx.isCard?"("+formatYen(tx.amount)+")":((tx.type==="income"?"+":"-")+formatYen(tx.amount)))
            ]),
            editB, delB
          ]));
        });
        tabContent.appendChild(list);
      });
    }
  }

  if (state.tab==="category") {
    var subTabs = div({className:"sub-tabs"}, ["expense","income"].map(function(key){
      var lbl = key==="expense"?"支出":"収入";
      var active = state.catType===key;
      var b = btn({className:"sub-tab",style:{
        background:active?(key==="expense"?"#ffe4e6":"#d1fae5"):"transparent",
        color:active?(key==="expense"?"#f43f5e":"#10b981"):"#94a3b8",
        fontWeight:active?"700":"500"
      }}, [txt(lbl)]);
      b.addEventListener("click", function(){ setState({catType:key}); });
      return b;
    }));
    tabContent.appendChild(subTabs);
    tabContent.appendChild(div({className:"card",style:{padding:"16px"}}, [CategoryView(catBreakdown(state.catType),state.catType)]));
  }

  if (state.tab==="budget") tabContent.appendChild(BudgetView());
  if (state.tab==="goal") tabContent.appendChild(GoalView());
  if (state.tab==="diagnosis") tabContent.appendChild(DiagnosisView());
  if (state.tab==="graph") tabContent.appendChild(YearlyGraph());
  if (state.tab==="memo") tabContent.appendChild(MemoView());

  content.appendChild(tabContent);
  root.appendChild(content);

  var fab = btn({className:"fab",style:{background:isMemoTab?"#6366f1":"#10b981"}}, [txt("+")]);
  fab.addEventListener("click", function(){
    if (isMemoTab) setState({showMemoAdd:true});
    else setState({showAdd:true});
  });
  root.appendChild(fab);

  if (state.showAdd) root.appendChild(FormModal(null));
  if (state.editTx) root.appendChild(FormModal(state.editTx));
  if (state.confirmId) root.appendChild(ConfirmDialog(state.confirmId));
  if (state.showMemoAdd) root.appendChild(MemoModal(null));
  if (state.editMemo) root.appendChild(MemoModal(state.editMemo));
  if (state.confirmMemoId) root.appendChild(ConfirmMemoDialog(state.confirmMemoId));

  app.appendChild(root);
}

function showToast(msg) {
  var t = div({style:{position:"fixed",bottom:"90px",left:"50%",transform:"translateX(-50%)",background:"rgba(0,0,0,.75)",color:"#fff",padding:"10px 20px",borderRadius:"20px",fontSize:"14px",zIndex:"200",animation:"fadeIn .2s",whiteSpace:"nowrap"}}, [txt(msg)]);
  document.body.appendChild(t);
  setTimeout(function(){t.remove();},2000);
}

render();
</script>
</body>
</html>
